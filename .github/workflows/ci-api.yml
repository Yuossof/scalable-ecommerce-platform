name: API workflow - NodeJS
on:
  push:
    branches:
      - main
      - "release/**"
     
    paths:
      - "api/**"
      - "docker-compose.yaml"
      - ".github/workflows/ci-api.yml"
  pull_request:
    branches:
      - main
      - "release/**"

    paths:
      - "api/**"
      - "docker-compose.yaml"
      - ".github/workflows/ci-api.yml"

jobs:
  deplory:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v5

      - name: Checkout Environment
        run: |
          hostname
          whoami
          docker version

      - name: Download dependencies
        run: npm install

      - name: Test
        run: echo "testing stage"

      - name: Build and Deploy
        env:
          POSTGRES_HOST_PORT: "0"
          REDIS_HOST_PORT: "0"
          RABBITMQ_AMQP_HOST_PORT: "0"
          RABBITMQ_MANAGEMENT_HOST_PORT: "0"
          NOTIFICATION_HOST_PORT: "0"
        run: docker compose up -d --build api

      - name: Check containers
        run: docker compose ps

      - name: Show logs
        run: docker compose logs --tail=100