name: Notification service workflow - Golang

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "services/notification/**"
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - "services/notification/**"
jobs:
  deplory:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./services/notification

    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: services/payment/go.sum
          
      - name: Checkout Environment
        run: |
          hostname
          whoami
          docker version

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: echo "testing stage"

      - name: Build and Deploy
        run: docker compose up -d --build notification

      - name: Check containers
        run: docker compose ps

      - name: Show logs
        run: docker compose logs --tail=100