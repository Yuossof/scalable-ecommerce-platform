on:
  push:
    branches:
      - main
      - "release/**"
     
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  deplory:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./web
        
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Environment
        run: |
          hostname
          whoami
          docker version

      - name: Download dependencies
        run: npm install

      - name: Test
        run: echo "testing stage"

      - name: Build and Deploy
        run: docker compose up -d --build web

      - name: Check containers
        run: docker compose ps

      - name: Show logs
        run: docker compose logs --tail=100